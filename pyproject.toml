[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-semantic-skills-with-qmd"
version = "0.1.0"
description = "Hermes Agent semantic skill discovery using QMD."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.entry-points."hermes_agent.plugins"]
hermes-semantic-skills-with-qmd = "hermes_semantic_skills.plugin:register"

[tool.hatch.build.targets.wheel]
packages = ["hermes_semantic_skills"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
